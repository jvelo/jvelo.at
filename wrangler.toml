name = "jvelo-at"
main = "src/index.tsx"
compatibility_date = "2025-01-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"

[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAACsq9y4begav6jOv"

[[d1_databases]]
binding = "DB"
database_name = "jvelo-at-db"
database_id = "a11a154b-9d2f-418d-8bb2-17cb003dda9a"

# Atlas screenshot storage. Create with:
#   npx wrangler r2 bucket create jvelo-at-screenshots
# Served back through the Worker at /screenshots/:key, so no public R2 access
# or custom domain needed.
[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "jvelo-at-screenshots"

[observability]
enabled = true
