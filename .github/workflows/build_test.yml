on: [push, pull_request]

name: build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        id: cache-build
        with:
          path: ./*
          key: ${{ github.sha }}
